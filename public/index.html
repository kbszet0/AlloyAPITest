<!DOCTYPE html> <html> <head> <meta charset="UTF-8" /> <title>Customer Banking Application</title> </head> 

<body> <h1>Customer Form</h1> <form id="postForm">

<label>First Name:</label> <input type="text" id="name_first" required /> <br>

<label>Last Name:</label>
<input type="text" id="name_last" required /> <br>

<label>Address Line 1:</label>
<input type="text" id="address_line_1" required /> <br>

<label>Address Line 2:</label>
<input type="text" id="address_line_2" /> <br>

<label>City:</label>
<input type="text" id="address_city" required /> <br>

<label>State:</label>
<input type="text" id="address_state" pattern="[A-Za-z]{2}" maxlength="2" required /> <br>

<label>Zip/Postal Code:</label>
<input type="text" id="address_postal_code" pattern="\d{5}" maxlength="5" required />

<label>Country:</label>
<select name="country" id="address_country_code" value="US" required />  <option value = "US"> US </option> <br> </select> <br>

<label>Social Security Number:</label>
<input type="text" id="document_ssn" pattern="\d{3}-\d{2}-\d{4}" placeholder="xxx-xx-xxxx" required /> <br>

<label>Email:</label>
<input type="email" id="email" required /> <br>

<label>Date of Birth:</label>
<input type="date" id="birth_date" required /> <br>



<button type="submit">Submit Application</button> </form> <pre id="output"></pre> </body> </html>
